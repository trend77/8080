<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GameStop02 — PS4 13.02–13.52</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-width: 100%;
        min-height: 100%;
        overflow: hidden;
        background-color: #050812;
        background-image: url("background13xx.png");
        background-repeat: no-repeat;
        background-position: center center;
        background-size: 100% 100%;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }


      #brand {
        position: fixed;
        top: 24px;
        left: 0;
        right: 0;
        z-index: 10;
        text-align: center;
        font-size: clamp(28px, 5vw, 52px);
        font-weight: 900;
        letter-spacing: 1px;
        color: transparent;
        background: linear-gradient(
          90deg,
          red,
          orange,
          yellow,
          lime,
          cyan,
          blue,
          violet,
          red
        );
        background-size: 400% auto;
        -webkit-background-clip: text;
        background-clip: text;
        animation: brandRainbow 4s linear infinite;
        text-shadow: 0 0 18px rgba(0, 160, 255, 0.35);
      }

      #brand-sub {
        display: block;
        margin-top: 2px;
        font-size: 14px;
        letter-spacing: 4px;
        color: #dcecff;
        text-shadow: 0 0 10px rgba(0, 150, 255, 0.55);
      }

      #progress-ui {
        position: fixed;
        left: 8%;
        right: 8%;
        bottom: 12%;
        z-index: 10;
        text-align: center;
      }

      #progress-label {
        margin-bottom: 10px;
        font-size: 16px;
        font-weight: 600;
        color: #e9f5ff;
        text-shadow: 0 0 8px rgba(0, 150, 255, 0.45);
      }

      #progress-container {
        width: 100%;
        height: 12px;
        padding: 2px;
        box-sizing: border-box;
        border: 1px solid rgba(120, 190, 255, 0.55);
        border-radius: 999px;
        background: rgba(5, 12, 22, 0.78);
        box-shadow:
          0 0 12px rgba(0, 130, 255, 0.28),
          inset 0 0 8px rgba(0, 0, 0, 0.65);
        overflow: hidden;
      }

      #progress-bar {
        width: 5%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          red,
          orange,
          yellow,
          lime,
          cyan,
          blue,
          violet,
          red
        );
        background-size: 400% 100%;
        animation: progressRainbow 4s linear infinite;
        transition: width 0.35s ease;
        box-shadow: 0 0 10px rgba(80, 190, 255, 0.7);
      }

      #progress-percent {
        margin-top: 8px;
        font-size: 14px;
        font-weight: 700;
        color: #ffffff;
      }

      @keyframes brandRainbow {
        0% { background-position: 0% center; }
        100% { background-position: 400% center; }
      }

      @keyframes progressRainbow {
        0% { background-position: 0% 50%; }
        100% { background-position: 400% 50%; }
      }

      body.done #progress-bar {
        animation-duration: 1.8s;
      }

      body.fail #progress-bar {
        filter: grayscale(0.25);
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>

    <div id="brand">
      GameStop02
      <span id="brand-sub">JAILBREAK</span>
    </div>

    <div id="progress-ui">
      <div id="progress-label">جارٍ التهيئة...</div>
      <div id="progress-container">
        <div id="progress-bar"></div>
      </div>
      <div id="progress-percent">5%</div>
    </div>

<div id="spin"></div>
    <div id="msg">أعد تشغيل جهاز PS4</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
