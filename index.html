<!DOCTYPE html>
<html>
<head>
<title>PS4 7.00 - 13.52 FW GoldHEN Host by GameStop02 </title>
<link rel="stylesheet" href="style.css">

<style>
html, body {
    width: 100%;
    min-height: 100vh;
    margin: 0;
    padding: 0;

    background-image: url("background.png");
    background-position: center center;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    background-attachment: fixed;

    background-color: #05030a;
    overflow: hidden;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.12);
    pointer-events: none;
    z-index: 0;
}
body > * {
    position: relative;
    z-index: 1;
}
h1 {
    text-shadow: 0 2px 8px rgba(0,0,0,.8);
}
#msgs {
    /* Keeps the top-center area clear for the jailbreak/loading process. */
    width: min(760px, 80vw);
    margin-left: auto !important;
    margin-right: auto !important;
    text-align: center;
}
</style>

</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 7.00 to 13.52";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.00) {
            window.location.replace("cacheslopkit.html");
        } else if (fwNum === 13.02 || fwNum === 13.04 || fwNum === 13.50 || fwNum === 13.52) {
            window.location.replace("13xx/index.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum === 13.02 || fwNum === 13.04 || fwNum === 13.50 || fwNum === 13.52) {
            window.location.replace("13xx/index.html");
        }
    }
}
</script>
<h1 style="margin-top: 30px;">PS4 7.00 - 13.52 FW GoldHEN Host by GameStop02</h1>
<br>
<h1 id="msgs" class="rainbow-text" style="font-size: 30px; margin-top: 77px; margin-bottom: 455px;">
    جاري تحميل GoldHEN v2.4b18.11... يرجى الانتظار
</h1>
</body>
</html>
